<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Tech - Login</title>
    <style>
        :root {
            --bg-body: #0d0d1a;
            --bg-card: #15152b;
            --border-input: #363663;
            --text-main: #ffffff;
            --text-muted: #8c8ca3;
            --input-bg: #0d0d1a;
            --coral-main: #ff4d6d;
            --coral-hover: #ff758f;
            --coral-active: #c9184a;
            --focus-cyan: #00a8e8;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --bg-body: #f0f2f9;
            --bg-card: #ffffff;
            --border-input: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: #f8fafc;
            --coral-main: #e03152; 
            --coral-hover: #ff4d6d;
            --coral-active: #b91c1c;
            --focus-cyan: #0284c7;
            --shadow-color: rgba(15, 23, 42, 0.08);
        }

        body {
            background-color: var(--bg-body);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .theme-toggle-wrapper {
            margin-bottom: 20px;
            display: flex;
            justify-content: flex-end;
            width: 100%;
            max-width: 450px;
        }

        .theme-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-input);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px var(--shadow-color);
            transition: all 0.2s ease;
        }

        .login-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-input);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px var(--shadow-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
            animation: fadeIn 0.4s ease;
        }

        h2 {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            margin: 0 0 30px 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .form-group input {
            background-color: var(--input-bg);
            border: 2px solid var(--border-input);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
            width: 100%;
        }

        .form-group input:focus {
            border-color: var(--focus-cyan);
            box-shadow: 0 0 0 4px rgba(0, 168, 232, 0.15);
        }

        .btn-entrar {
            background-color: var(--coral-main);
            color: var(--bg-body);
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        [data-theme="light"] .btn-entrar {
            color: #ffffff;
        }

        .btn-entrar:hover {
            background-color: var(--coral-hover);
            transform: translateY(-1px);
        }

        .btn-entrar:active {
            background-color: var(--coral-active);
            transform: translateY(0);
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer-link a {
            color: var(--coral-main);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="theme-toggle-wrapper">
        <button class="theme-btn" id="themeToggleBtn" aria-label="Alternar tema visual">
            🌓 Alterar Tema
        </button>
    </div>

    <!-- Container do Card de Login (Rota 3) -->
    <div class="login-container">
        <h2>Entra na tua conta</h2>
        <p class="subtitle">Bem-vindo de volta, Dev!</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginNome">Nome</label>
                <input type="text" id="loginNome" placeholder="O teu nome de utilizador" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="loginSenha">Palavra-passe</label>
                <input type="password" id="loginSenha" placeholder="A tua senha secreta" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-entrar">Entrar na Plataforma →</button>
        </form>

        <!-- Link reconfigurado apontando para a Rota 2 -->
        <div class="footer-link">
            Ainda não tens conta? <a href="/polls/cadastro/">Cadastra-te aqui</a>
        </div>
    </div>

    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const htmlElement = document.documentElement;

        const savedTheme = localStorage.getItem('theme') || 'dark';
        htmlElement.setAttribute('data-theme', savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (event) => {
            event.preventDefault();
            
            // Redireciona a criança com sucesso para a Rota 1 (Página Inicial/Cards)
            window.location.href = '/polls/';
        });
    </script>
</body>
</html>
